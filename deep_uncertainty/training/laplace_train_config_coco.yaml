experiment_name: laplace-coco-people
random_seed: 1998
head_type: double_poisson_laplace
dataset:
  type: image
  spec: coco_people
training:
  accelerator: gpu
  batch_size: 256
  accumulate_grad_batches: 1
  beta_scheduler:
    type: cosine_annealing
    kwargs:
      beta_0: 1.0
      beta_1: 1.0
      last_epoch: -1
  freeze_backbone: False
  chkp_dir: path/to/chkp/dir
  chkp_freq: 10
  num_epochs: 10
  optimizer:
    type: adam_w
    kwargs:
      lr: 0.0001
      weight_decay: 0.001
  lr_scheduler:
    type: cosine_annealing
    kwargs:
      T_max: 10
      eta_min: 0
      last_epoch: -1
  precision: 32
model:
  num_mc_samples: 50
  init_prec_diag: 1.0
  grad_clip_norm: 1.0
evaluation:
  num_trials: 1
  log_dir: path/to/log/dir

# CUDA_VISIBLE_DEVICES=0 python -m deep_uncertainty.training.train_model --config deep_uncertainty/training/laplace_train_config_coco.yaml

# python -m deep_uncertainty.evaluation.eval_model   --config-path deep_uncertainty/training/laplace_train_config.yaml   --chkp-path path/to/chkp/dir/laplace_length_of_stay/version_40/best_loss.ckpt   --log-dir path/to/log/dir/laplace_length_of_stay/version_40